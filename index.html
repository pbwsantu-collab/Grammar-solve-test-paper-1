      menuBackdrop.classList.remove('hidden');
    }

    function closeDrawer() {
      sidebarMenu.classList.add('-translate-x-full');
      menuBackdrop.classList.add('hidden');
    }

    menuToggleBtn.addEventListener('click', openDrawer);
    closeDrawerBtn.addEventListener('click', closeDrawer);
    menuBackdrop.addEventListener('click', closeDrawer);

    // Filters Setup
    function initFilters() {
      const categories = ["ALL", ...new Set(grammarData.map(d => d.category))];
      const catContainer = document.getElementById('category-filters');
      catContainer.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="w-full text-left px-3 py-1.5 rounded-xl text-xs font-medium transition ${activeCategory === cat ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-700/50 hover:text-slate-200'}">
          ${cat === 'ALL' ? '📌 সকল বিষয়' : cat}
        </button>
      `).join('');

      const sets = ["ALL", ...new Set(grammarData.map(d => d.set))];
      const setContainer = document.getElementById('set-filters');
      setContainer.innerHTML = sets.map(s => `
        <button onclick="setSet('${s}')" class="px-2 py-1.5 rounded-xl text-xs font-medium transition text-center border ${activeSet === s ? 'bg-blue-600 border-blue-500 text-white shadow-md' : 'bg-slate-900/60 border-slate-700/50 text-slate-300 hover:border-blue-500'}">
          ${s === 'ALL' ? 'সব সেট' : s}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      initFilters();
      renderQuestions();
      if (window.innerWidth < 1024) closeDrawer();
    }

    function setSet(s) {
      activeSet = s;
      initFilters();
      renderQuestions();
      if (window.innerWidth < 1024) closeDrawer();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderQuestions();
    });

    document.getElementById('reset-all-btn').addEventListener('click', () => {
      activeCategory = "ALL";
      activeSet = "ALL";
      searchQuery = "";
      document.getElementById('search-input').value = "";
      initFilters();
      renderQuestions();
    });

    function updateProgress() {
      const total = grammarData.length;
      const count = completedQuestions.size;
      document.getElementById('progress-text').innerText = `${count} / ${total}`;
      localStorage.setItem('completed_questions', JSON.stringify([...completedQuestions]));
    }

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      
      const filtered = grammarData.filter(item => {
        const matchesCategory = activeCategory === "ALL" || item.category === activeCategory;
        const matchesSet = activeSet === "ALL" || item.set === activeSet;
        const matchesSearch = item.question.toLowerCase().includes(searchQuery) ||
                              item.title.toLowerCase().includes(searchQuery) ||
                              item.category.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSet && matchesSearch;
      });

      document.getElementById('active-filter-label').innerText = 
        `দেখাচ্ছে: ${filtered.length} টি প্রশ্ন (${activeCategory !== 'ALL' ? activeCategory : 'সকল বিষয়'})`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-slate-800/30 rounded-2xl border border-slate-700/40">
            <span class="text-3xl">🔍</span>
            <p class="mt-2 text-xs text-slate-400">কোনো প্রশ্ন পাওয়া যায়নি!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((item) => {
        const isDone = completedQuestions.has(item.id);
        return `
          <div class="p-5 rounded-2xl bg-slate-800/60 border border-slate-700/70 glass shadow-md transition hover:border-slate-600 relative">
            
            <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-500/20 text-blue-300 border border-blue-500/30">
                  ${item.set}
                </span>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                  ${item.category}
                </span>
              </div>
              
              <button onclick="toggleDone(${item.id})" class="text-xs font-medium px-2.5 py-1 rounded-xl transition flex items-center gap-1 ${isDone ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-slate-700/50 text-slate-400 hover:bg-slate-700'}">
                ${isDone ? '✓ অনুশীলিত' : '○ চিহ্নিত করুন'}
              </button>
            </div>

            <h3 class="text-base font-semibold text-white mb-2">${item.title}</h3>
            <p class="text-xs sm:text-sm text-slate-200 leading-relaxed font-mono bg-slate-900/80 p-3 rounded-xl border border-slate-700/50 whitespace-pre-line mb-4">
              ${item.question}
            </p>

            <div class="flex items-center gap-3 pt-2 border-t border-slate-700/50">
              <button onclick="toggleAnswer(${item.id})" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition shadow-md flex items-center gap-2">
                <span>💡</span> উত্তর ও বাংলায় ব্যাখ্যা দেখুন
              </button>
            </div>

            <div id="answer-box-${item.id}" class="hidden mt-4 p-4 rounded-xl bg-slate-950/90 border border-blue-500/40 space-y-3 transition-all duration-300">
              <div class="flex items-center gap-2 text-emerald-400 text-xs font-bold uppercase tracking-wider">
                <span>✔</span> সঠিক উত্তর:
              </div>
              <div class="text-xs sm:text-sm font-semibold text-emerald-200 bg-emerald-950/40 p-2.5 rounded-lg border border-emerald-500/30 font-mono whitespace-pre-line">
                ${item.answer}
              </div>

              <div class="flex items-center gap-2 text-blue-400 text-xs font-bold uppercase tracking-wider pt-1">
                <span>📘</span> বিস্তারিত ব্যাখ্যা (Bengali Rule):
              </div>
              <div class="text-xs text-slate-300 leading-relaxed bg-blue-950/20 p-3 rounded-lg border border-blue-500/20 whitespace-pre-line">
                ${item.explanationBn}
              </div>
            </div>

          </div>
        `;
      }).join('');

      updateProgress();
    }

    function toggleAnswer(id) {
      const box = document.getElementById(`answer-box-${id}`);
      if (box) box.classList.toggle('hidden');
    }

    function toggleDone(id) {
      if (completedQuestions.has(id)) {
        completedQuestions.delete(id);
      } else {
        completedQuestions.add(id);
      }
      renderQuestions();
    }

    // Theme Toggle
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    let isDark = true;

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      if (isDark) {
        document.documentElement.classList.add('dark');
        themeIcon.innerText = '🌙';
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.innerText = '☀️';
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      initFilters();
      renderQuestions();
    });
  </script>
</body>
</html>
