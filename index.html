<html lang="bn">
<head>

    <title>সম্পূর্ণ ইংরেজি গ্রামার - ক্যাটাগরি অনুযায়ী</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f0ebe5; min-height: 100vh; padding: 15px; }
        .app { max-width: 950px; margin: 0 auto; background: white; border-radius: 28px; padding: 20px 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .menu-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #e8e0d8; padding: 10px 16px; border-radius: 50px; margin-bottom: 25px; }
        .menu-bar .brand { font-weight: 700; font-size: 1.1rem; color: #2d1f14; margin-right: auto; }
        .menu-btn { background: #d5c9bd; border: none; font-size: 1.5rem; padding: 4px 14px; border-radius: 30px; cursor: pointer; color: #2d1f14; font-weight: bold; }
        .menu-btn:hover { background: #c4b5a6; }
        .menu-dropdown { display: flex; flex-wrap: wrap; gap: 4px; background: white; padding: 8px 10px; border-radius: 40px; width: 100%; margin-top: 4px; max-height: 350px; overflow-y: auto; }
        .menu-dropdown button { background: #ede7e0; border: none; padding: 4px 10px; border-radius: 30px; font-weight: 500; color: #2d1f14; cursor: pointer; font-size: 0.7rem; transition: 0.2s; white-space: nowrap; }
        .menu-dropdown button:hover { background: #d5c9bd; }
        .menu-dropdown button.active-set { background: #8b7a6a; color: white; }
        .set-card { display: none; animation: fadeIn 0.3s ease; }
        .set-card.active { display: block; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        .question-block { background: #faf8f5; border-radius: 20px; padding: 16px 18px; margin-bottom: 16px; border: 1px solid #e0d6cc; }
        .question-text { font-size: 0.92rem; font-weight: 500; color: #1f140e; line-height: 1.7; margin-bottom: 10px; }
        .question-text .blank { color: #c0392b; font-weight: 700; text-decoration: underline; text-decoration-color: #c0392b; text-underline-offset: 3px; }
        .answer-area { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 4px; }
        .answer-input { padding: 8px 16px; border: 2px solid #d5c9bd; border-radius: 30px; font-size: 0.9rem; min-width: 200px; flex: 1; outline: none; transition: 0.2s; background: white; }
        .answer-input:focus { border-color: #8b7a6a; box-shadow: 0 0 0 3px rgba(139, 122, 106, 0.2); }
        .answer-input.correct { border-color: #2e7d32; background: #e8f5e9; }
        .answer-input.wrong { border-color: #c62828; background: #ffebee; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .check-btn { background: #8b7a6a; color: white; border: none; padding: 8px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .check-btn:hover { background: #6d5e4f; transform: scale(0.97); }
        .show-answer-btn { background: #d5c9bd; color: #2d1f14; border: none; padding: 8px 18px; border-radius: 30px; font-weight: 500; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .show-answer-btn:hover { background: #c4b5a6; }
        .explanation { background: #f1ece6; border-radius: 16px; padding: 12px 18px; margin: 12px 0 2px; font-size: 0.9rem; border-left: 5px solid #8b7a6a; color: #1f180f; line-height: 1.6; display: none; }
        .explanation.show { display: block; }
        .explanation strong { color: #4a3728; }
        .explanation .correct-answer { color: #2e7d32; font-weight: 700; }
        .badge-set { display: inline-block; background: #cdbeb1; color: #241b13; font-size: 0.65rem; font-weight: 600; padding: 2px 12px; border-radius: 30px; margin-bottom: 4px; }
        .footer-note { margin-top: 22px; text-align: center; font-size: 0.8rem; color: #756352; border-top: 1px solid #e0d5ca; padding-top: 14px; }
        .q-count { color: #7a6856; font-size: 0.75rem; }
        .set-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .total-questions { background: #8b7a6a; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.65rem; }
        .progress-bar { background: #e8e0d8; height: 4px; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: #8b7a6a; height: 100%; transition: width 0.3s; width: 0%; }
        .status-text { font-size: 0.8rem; color: #6d5e4f; margin-top: 4px; }
        .result-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .result-badge.correct { background: #c8e6c9; color: #1b5e20; }
        .result-badge.wrong { background: #ffcdd2; color: #b71c1c; }
        .category-tag { display: inline-block; background: #8b7a6a; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.6rem; margin-left: 8px; }
        @media (max-width: 600px) { .app { padding: 10px 12px; } .menu-bar { padding: 6px 10px; } .question-text { font-size: 0.85rem; } .answer-input { font-size: 0.8rem; min-width: 120px; padding: 6px 12px; } .check-btn, .show-answer-btn { font-size: 0.75rem; padding: 6px 14px; } }
    </style>
</head>

                { q: 'The great leader died last week. → Replace with phrasal verb (simple past).', blanks: ['passed away'], exp: '“died” → “passed away” – মৃত্যুবরণ করা (অতীত)।' },
                { q: 'Gandhiji sacrificed his life. → Replace with phrasal verb (simple past).', blanks: ['gave up'], exp: '“sacrificed” → “gave up” – উৎসর্গ করা (অতীত)।' },
                { q: 'She is trying to find a job. → Replace with phrasal verb (present continuous).', blanks: ['looking for'], exp: '“is trying to find” → “is looking for” – খোঁজ করা (বর্তমান)।' },
                { q: 'The workers have withdrawn the strike. → Replace with phrasal verb (present perfect).', blanks: ['called off'], exp: '“have withdrawn” → “have called off” – প্রত্যাহার করা (পারফেক্ট)।' },
                { q: 'The man abandoned evil company. → Replace with phrasal verb (simple past).', blanks: ['gave up'], exp: '“abandoned” → “gave up” – ত্যাগ করা (অতীত)।' },
                { q: 'Let the police come and investigate. → Replace with phrasal verb (infinitive).', blanks: ['look into'], exp: '“investigate” → “look into” – তদন্ত করা (infinitive)।' },
                { q: 'The thief saw me and fled. → Replace with phrasal verb (simple past).', blanks: ['ran off'], exp: '“fled” → “ran off” – পালিয়ে যাওয়া (অতীত)।' },
                { q: 'The actor has gained a lot of weight. → Replace with phrasal verb (present perfect).', blanks: ['put on'], exp: '“has gained weight” → “has put on” – ওজন বাড়া (পারফেক্ট)।' },
                { q: 'He experienced great suffering. → Replace with phrasal verb (simple past).', blanks: ['went through'], exp: '“experienced” → “went through” – অভিজ্ঞতা লাভ করা (অতীত)।' },
                { q: 'In Puri I stayed in Sea View Hotel. → Replace with phrasal verb (simple past).', blanks: ['put up'], exp: '“stayed” → “put up” – থাকা (অস্থায়ী, অতীত)।' },
                { q: 'The meeting was postponed. → Replace with phrasal verb (simple past passive).', blanks: ['put off'], exp: '“was postponed” → “was put off” – স্থগিত করা (প্যাসিভ অতীত)।' },
                { q: 'We must reduce our daily expenses. → Replace with phrasal verb (infinitive).', blanks: ['cut down'], exp: '“reduce” → “cut down” – কমানো (infinitive)।' },
                { q: 'You must not hide anything from the police. → Replace with phrasal verb (infinitive).', blanks: ['hold back'], exp: '“hide” → “hold back” – গোপন করা (infinitive)।' },
                { q: 'Overeating affects our health. → Replace with phrasal verb (simple present).', blanks: ['tells upon'], exp: '“affects” → “tells upon” – প্রভাব ফেলা (বর্তমান)।' },
                { q: 'The patient will recover within a week. → Replace with phrasal verb (future).', blanks: ['come round'], exp: '“will recover” → “will come round” – সুস্থ হওয়া (ভবিষ্যৎ)।' },
                { q: 'Please do not reject my proposal. → Replace with phrasal verb (imperative).', blanks: ['turn down'], exp: '“do not reject” → “do not turn down” – প্রত্যাখ্যান করা (আদেশ)।' },
                { q: 'He wore a white shirt. → Replace with phrasal verb (simple past).', blanks: ['put on'], exp: '“wore” → “put on” – পরিধান করা (অতীত)।' },
                { q: 'The villagers were chasing the herd of elephants. → Replace with phrasal verb (past continuous).', blanks: ['running after'], exp: '“were chasing” → “were running after” – তাড়া করা (চলমান অতীত)।' },
                { q: 'They must maintain the prestige of the school. → Replace with phrasal verb (infinitive).', blanks: ['keep up'], exp: '“maintain” → “keep up” – বজায় রাখা (infinitive)।' },
                { q: 'Adrija\'s proposal was rejected by Koushiki. → Replace with phrasal verb (simple past passive).', blanks: ['turned down'], exp: '“was rejected” → “was turned down” – প্রত্যাখ্যান করা (প্যাসিভ অতীত)।' },
                { q: 'Our school closes at 4.30 P.M. → Replace with phrasal verb.', blanks: ['breaks up'], exp: '“closes” → “breaks up” – শেষ হওয়া (বিদ্যালয়)।' },
                { q: 'He has caused his own ruin. → Replace with phrasal verb.', blanks: ['brought about'], exp: '“caused” → “brought about” – ঘটানো।' },
                { q: 'Fetch a doctor at once. → Replace with phrasal verb.', blanks: ['call in'], exp: '“Fetch” → “call in” – ডেকে আনা।' },
                { q: 'Rana is searching a government job. → Replace with phrasal verb.', blanks: ['looking for'], exp: '“searching” → “looking for” – খোঁজ করা।' },
                { q: 'Don\'t hate the poor. → Replace with phrasal verb.', blanks: ['look down upon'], exp: '“hate” → “look down upon” – অবজ্ঞা করা।' },
                { q: 'I met Sahana at the bus stop. → Replace with phrasal verb.', blanks: ['came across'], exp: '“met” → “came across” – দেখা হওয়া (হঠাৎ)।' },
                { q: 'The proposal was rejected. → Replace with phrasal verb.', blanks: ['turned down'], exp: '“rejected” → “turned down” – প্রত্যাখ্যান করা।' },
                { q: 'The enemies surrendered at last. → Replace with phrasal verb.', blanks: ['gave in'], exp: '“surrendered” → “gave in” – আত্মসমর্পণ করা।' },
                { q: 'Shun evil company. → Replace with phrasal verb.', blanks: ['give up'], exp: '“Shun” → “give up” – ত্যাগ করা।' },
                { q: 'The saffron on the top of our national flag symbolizes sacrifice. → Replace with phrasal verb.', blanks: ['stands for'], exp: '“symbolizes” → “stands for” – প্রতীকায়িত করা।' },
                { q: 'The dacoits fled with valuables. → Replace with phrasal verb.', blanks: ['made off'], exp: '“fled” → “made off” – পালিয়ে যাওয়া (সঙ্গে নিয়ে)।' },
                { q: 'He never despises anybody. → Replace with phrasal verb.', blanks: ['looks down upon'], exp: '“despises” → “looks down upon” – অবজ্ঞা করা।' },
                { q: 'The Headmaster distributed books among the students. → Replace with phrasal verb.', blanks: ['gave away'], exp: '“distributed” → “gave away” – বিতরণ করা।' },
                { q: 'She did not appear for class today. → Replace with phrasal verb.', blanks: ['turned up'], exp: '“appear” → “turned up” – উপস্থিত হওয়া (নেতিবাচক)।' }
            ]
        },
        // ====== CATEGORY 8: Clause Analysis ======
        {
            name: "৮. Clause Analysis",
            questions: [
                { q: 'The girl who lost her umbrella in the storm was weeping bitterly. → Analyze: What is the main clause?', blanks: ['The girl was weeping bitterly'], exp: 'Main clause: “The girl was weeping bitterly” – এটি মূল বাক্য।' },
                { q: 'The girl who lost her umbrella in the storm was weeping bitterly. → What is the subordinate clause?', blanks: ['who lost her umbrella in the storm'], exp: 'Subordinate clause: “who lost her umbrella in the storm” – এটি adjective clause।' },
                { q: 'Your father has painted a picture which will be sold at an auction. → Identify the clause: "which will be sold at an auction" is what type of clause?', blanks: ['Adjective clause'], exp: '“which will be sold at an auction” – এটি Adjective clause (relative clause), কারণ picture-কে modify করছে।' },
                { q: 'I know where he lives. → Identify the clause: "where he lives"', blanks: ['Noun clause'], exp: '“where he lives” – এটি Noun clause, কারণ এটি “know”-এর object।' },
                { q: 'He came after I had left. → Identify the clause: "after I had left"', blanks: ['Adverb clause'], exp: '“after I had left” – এটি Adverb clause of time।' },
                { q: 'The book that you gave me is interesting. → Identify the clause: "that you gave me"', blanks: ['Adjective clause'], exp: '“that you gave me” – এটি Adjective clause (relative clause), কারণ book-কে modify করছে।' }
            ]
        },
        // ====== CATEGORY 9: Figures of Speech ======
        {
            name: "৯. Figures of Speech",
            questions: [
                { q: '"Cannons boomed at the battlefield." → Identify the figure of speech.', blanks: ['Onomatopoeia'], exp: '“boomed” – শব্দ অনুকরণ (Onomatopoeia)।' },
                { q: '"The water mirrors a still sky." → Identify the figure of speech.', blanks: ['Metaphor'], exp: '“mirrors” – রূপক (Metaphor), জল আকাশকে প্রতিফলিত করে।' },
                { q: '"I came to bury Caesar, not to praise him." → Identify the figure of speech.', blanks: ['Antithesis'], exp: '“bury” ও “praise” – বিপরীত ধারণা (Antithesis)।' },
                { q: '"The thirsty earth drank the water." → Identify the figure of speech.', blanks: ['Personification'], exp: '“thirsty earth drank” – প্রকৃতিকে মানবীয় গুণ দেওয়া (Personification)।' },
                { q: '"Teddy bears are never hungry because they are stuffed." → Identify the figure of speech.', blanks: ['Pun'], exp: '“stuffed” – শব্দের দ্ব্যর্থতা (Pun) – stuffed মানে both ভরা এবং পেট ভরা।' },
                { q: '"The busiest man has the amplest leisure." → Identify the figure of speech.', blanks: ['Paradox'], exp: 'বিরোধাভাস (Paradox) – ব্যস্ত মানুষের বেশি অবসর থাকে বলে মনে হয়।' },
                { q: '"Life is a dream." → Identify the figure of speech.', blanks: ['Metaphor'], exp: '“Life is a dream” – রূপক (Metaphor), জীবনকে স্বপ্নের সাথে তুলনা।' },
                { q: '"The wind whispered through the trees." → Identify the figure of speech.', blanks: ['Personification'], exp: '“wind whispered” – বাতাসকে মানবীয় গুণ দেওয়া (Personification)।' },
                { q: '"She is as beautiful as a rose." → Identify the figure of speech.', blanks: ['Simile'], exp: '“as beautiful as a rose” – উপমা (Simile), “as…as” দিয়ে তুলনা।' },
                { q: '"The pen is mightier than the sword." → Identify the figure of speech.', blanks: ['Metonymy'], exp: '“pen” (লেখা) এবং “sword” (যুদ্ধ) – Metonymy, এক জিনিসের নামে অন্য জিনিস বোঝানো।' }
            ]
        }
    ];

    // ============================================================
    //  RENDER ENGINE
    // ============================================================
    const container = document.getElementById('setContainer');
    const menuDropdown = document.getElementById('menuDropdown');
    let currentSet = 0;

    // Build menu
    setsData.forEach((set, idx) => {
        const btn = document.createElement('button');
        btn.dataset.index = idx;
        btn.textContent = set.name;
        menuDropdown.appendChild(btn);
    });

    let totalQ = 0;
    setsData.forEach(s => totalQ += s.questions.length);
    document.getElementById('totalQ').textContent = totalQ + 'টি প্রশ্ন';

    function updateProgress(setIdx) {
        const card = document.querySelectorAll('.set-card')[setIdx];
        if (!card) return;
        const blocks = card.querySelectorAll('.question-block');
        let done = 0;
        blocks.forEach(block => {
            const input = block.querySelector('.answer-input');
            if (input && (input.className.includes('correct') || input.className.includes('wrong'))) {
                done++;
            }
        });
        const total = blocks.length;
        const pct = total > 0 ? (done / total) * 100 : 0;
        const fill = document.getElementById('progressFill');
        if (fill) fill.style.width = pct + '%';
    }

    function renderAllSets() {
        container.innerHTML = '';
        setsData.forEach((set, idx) => {
            const card = document.createElement('div');
            card.className = `set-card${idx === currentSet ? ' active' : ''}`;
            card.dataset.index = idx;

            const header = document.createElement('div');
            header.className = 'set-header';
            header.innerHTML = `
                <span class="badge-set">📌 ${set.name}</span>
                <span class="q-count">${set.questions.length} টি প্রশ্ন</span>
            `;
            card.appendChild(header);

            set.questions.forEach((q, qi) => {
                const block = document.createElement('div');
                block.className = 'question-block';

                const qText = document.createElement('div');
                qText.className = 'question-text';
                let displayText = q.q;
                const blankCount = (q.blanks || []).length;
                if (blankCount > 0) {
                    let parts = displayText.split('______');
                    let newText = '';
                    for (let i = 0; i < parts.length; i++) {
                        newText += parts[i];
                        if (i < parts.length - 1) {
                            newText += `<span class="blank">[${i+1}]</span>`;
                        }
                    }
                    displayText = newText;
                }
                qText.innerHTML = `${qi+1}. ${displayText}`;
                block.appendChild(qText);

                const answerArea = document.createElement('div');
                answerArea.className = 'answer-area';

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'answer-input';
                input.placeholder = 'আপনার উত্তর টাইপ করুন...';
                answerArea.appendChild(input);

                const btnGroup = document.createElement('div');
                btnGroup.className = 'btn-group';

                const checkBtn = document.createElement('button');
                checkBtn.className = 'check-btn';
                checkBtn.textContent = '✅ চেক করুন';

                const showBtn = document.createElement('button');
                showBtn.className = 'show-answer-btn';
                showBtn.textContent = '💡 দেখুন';

                btnGroup.appendChild(checkBtn);
                btnGroup.appendChild(showBtn);
                answerArea.appendChild(btnGroup);

                const statusText = document.createElement('div');
                statusText.className = 'status-text';
                statusText.textContent = '';

                const explDiv = document.createElement('div');
                explDiv.className = 'explanation';
                const correctAns = (q.blanks || []).join(', ');
                explDiv.innerHTML = `
                    <strong>📖 সঠিক উত্তর:</strong> <span class="correct-answer">${correctAns}</span><br>
                    <strong>💡 ব্যাখ্যা:</strong> ${q.exp || 'সঠিক উত্তরটি উপরে দেওয়া আছে।'}
                `;

                checkBtn.addEventListener('click', function() {
                    const userAnswer = input.value.trim();
                    const correctAnswers = q.blanks || [];
                    const userParts = userAnswer.split(/[,،\s]+/).filter(p => p.length > 0);
                    
                    let allCorrect = false;
                    if (correctAnswers.length === 1) {
                        allCorrect = userAnswer.toLowerCase() === correctAnswers[0].toLowerCase();
                    } else if (userParts.length === correctAnswers.length) {
                        allCorrect = true;
                        for (let i = 0; i < correctAnswers.length; i++) {
                            if (userParts[i].toLowerCase() !== correctAnswers[i].toLowerCase()) {
                                allCorrect = false;
                                break;
                            }
                        }
                    }

                    if (allCorrect && userAnswer.length > 0) {
                        input.className = 'answer-input correct';
                        statusText.innerHTML = '<span class="result-badge correct">✅ সঠিক উত্তর!</span>';
                    } else if (userAnswer.length > 0) {
                        input.className = 'answer-input wrong';
                        statusText.innerHTML = `<span class="result-badge wrong">❌ ভুল উত্তর।</span> সঠিক: "${correctAnswers.join(', ')}"`;
                    } else {
                        statusText.textContent = '⚠️ অনুগ্রহ করে উত্তর টাইপ করুন।';
                        statusText.style.color = '#e65100';
                    }

                    explDiv.classList.add('show');
                    updateProgress(idx);
                });

                showBtn.addEventListener('click', function() {
                    const correctAns = (q.blanks || []).join(', ');
                    input.value = correctAns;
                    input.className = 'answer-input correct';
                    statusText.innerHTML = '<span class="result-badge correct">✅ সঠিক উত্তর দেখানো হয়েছে।</span>';
                    explDiv.classList.add('show');
                    updateProgress(idx);
                });

                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        checkBtn.click();
                    }
                });

                block.appendChild(answerArea);
                block.appendChild(statusText);
                block.appendChild(explDiv);
                card.appendChild(block);
            });

            container.appendChild(card);
        });
    }

    function showSet(index) {
        currentSet = index;
        document.querySelectorAll('.set-card').forEach((c, i) => {
            c.classList.toggle('active', i === index);
        });
        document.querySelectorAll('.menu-dropdown button').forEach((btn, i) => {
            btn.classList.toggle('active-set', i === index);
        });
        const dd = document.getElementById('menuDropdown');
        if (window.innerWidth < 640) dd.style.display = 'none';
        updateProgress(index);
    }

    document.getElementById('menuToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        const dd = document.getElementById('menuDropdown');
        dd.style.display = dd.style.display === 'none' ? 'flex' : 'none';
    });

    document.querySelectorAll('.menu-dropdown button').forEach((btn) => {
        btn.addEventListener('click', function() {
            showSet(parseInt(this.dataset.index));
            const dd = document.getElementById('menuDropdown');
            if (window.innerWidth < 640) dd.style.display = 'none';
        });
    });

    document.addEventListener('click', function(e) {
        const dd = document.getElementById('menuDropdown');
        const toggle = document.getElementById('menuToggle');
        if (!dd.contains(e.target) && !toggle.contains(e.target)) {
            dd.style.display = 'none';
        }
    });

    renderAllSets();
    showSet(0);
})();
</script>
