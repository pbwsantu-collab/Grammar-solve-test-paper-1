<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সম্পূর্ণ ইংরেজি গ্রামার কুইজ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0ebe5;
            min-height: 100vh;
            padding: 15px;
        }
        .app {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 20px 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .menu-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: #e8e0d8;
            padding: 10px 16px;
            border-radius: 50px;
            margin-bottom: 25px;
        }
        .menu-bar .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2d1f14;
            margin-right: auto;
        }
        .menu-btn {
            background: #d5c9bd;
            border: none;
            font-size: 1.5rem;
            padding: 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            color: #2d1f14;
            font-weight: bold;
        }
        .menu-btn:hover {
            background: #c4b5a6;
        }
        .menu-dropdown {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: white;
            padding: 10px 14px;
            border-radius: 40px;
            width: 100%;
            margin-top: 4px;
        }
        .menu-dropdown button {
            background: #ede7e0;
            border: none;
            padding: 5px 14px;
            border-radius: 30px;
            font-weight: 500;
            color: #2d1f14;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .menu-dropdown button:hover {
            background: #d5c9bd;
        }
        .menu-dropdown button.active-set {
            background: #8b7a6a;
            color: white;
        }
        .set-card {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .set-card.active {
            display: block;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .question-block {
            background: #faf8f5;
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 18px;
            border: 1px solid #e0d6cc;
        }
        .question-text {
            font-size: 0.98rem;
            font-weight: 500;
            color: #1f140e;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin: 8px 0 4px;
        }
        .option-btn {
            background: white;
            border: 2px solid #d5c9bd;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
            color: #2d1f14;
            cursor: pointer;
            font-size: 0.88rem;
            transition: 0.15s;
        }
        .option-btn:hover {
            background: #ede7e0;
            border-color: #b8a491;
        }
        .option-btn.correct {
            background: #c8e6c9;
            border-color: #2e7d32;
            color: #1b5e20;
        }
        .option-btn.wrong {
            background: #ffcdd2;
            border-color: #c62828;
            color: #b71c1c;
        }
        .explanation {
            background: #f1ece6;
            border-radius: 16px;
            padding: 12px 18px;
            margin: 12px 0 4px;
            font-size: 0.93rem;
            border-left: 5px solid #8b7a6a;
            color: #1f180f;
            line-height: 1.6;
        }
        .explanation strong {
            color: #4a3728;
        }
        .badge-set {
            display: inline-block;
            background: #cdbeb1;
            color: #241b13;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 30px;
            margin-bottom: 4px;
        }
        .footer-note {
            margin-top: 22px;
            text-align: center;
            font-size: 0.85rem;
            color: #756352;
            border-top: 1px solid #e0d5ca;
            padding-top: 16px;
        }
        .q-count {
            color: #7a6856;
            font-size: 0.8rem;
        }
        .set-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        @media (max-width: 600px) {
            .app { padding: 12px 14px; }
            .menu-bar { padding: 8px 12px; }
            .question-text { font-size: 0.9rem; }
            .option-btn { font-size: 0.8rem; padding: 5px 12px; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="menu-bar">
        <span class="brand">📘 গ্রামার কুইজ</span>
        <button class="menu-btn" id="menuToggle">☰</button>
        <div class="menu-dropdown" id="menuDropdown" style="display: none;"></div>
    </div>
    <div class="set-container" id="setContainer"></div>
    <div class="footer-note">✅ উত্তর ক্লিক করলে ব্যাখ্যা দেখাবে · মেনু বোতামে সেট বদলান</div>
</div>

<script>
(function() {
    // ============================================================
    //  ALL QUESTIONS - সম্পূর্ণ ডেটা
    // ============================================================
    const setsData = [
        // ----- সেট ১ (Images 1 & 2) -----
        {
            name: "সেট ১",
            questions: [
                { q: 'Today we are ______ (confined/confining/being confining) in a room as it ______ (is/has been/was) raining since morning and we are busy ______ (playing/played/having played) ludo.',
                  opts: [['confined', 'has been', 'playing'], ['confining', 'is', 'played'], ['being confining', 'was', 'having played']], ans: 0,
                  exp: '✅ “confined” (বন্দী) + “has been raining” (সকাল থেকে) + “playing” (ব্যস্ত) – বর্তমান নিখুঁত ও চলমান কাজ।' },
                { q: 'Most people are fond ______ mystery stories. They find ______ extra pleasure ______ trying to solve the mystery.',
                  opts: [['of', 'an', 'in'], ['for', 'the', 'at'], ['with', 'a', 'on']], ans: 0,
                  exp: '✅ “fond of” (পছন্দ), “an extra pleasure” (একটি বাড়তি আনন্দ), “in trying” (চেষ্টায়)।' },
                { q: '"This is one of the oldest houses of our locality." — Change into comparative degree.',
                  opts: ['This is older than most other houses in our locality.', 'This is oldest than any other house.', 'This house is old than others.'], ans: 0,

                { q: 'Nisha said to Romita, "Have you completed your task?" — Change narration.',

                { q: 'Tanima is in search of a job. — Replace with phrasal verb.',

        // ----- সেট ৩ (Image 4) -----
        {

                { q: '"It was raining hard. Abir went to school." — Turn into compound sentence.',

                { q: 'The man was shot last night. — Change the voice.',

                { q: 'My friend visited me yesterday. — Replace with phrasal verb (call on).',

                { q: 'The secretary distributed the prizes on August 15. — Replace with phrasal verb (give away).',
                  opts: ['gave away', 'fall out', 'give in'], ans: 0,
                  exp: '✅ “distributed” → “gave away” – বিতরণ করা।' }
            ]
        },
        // ----- সেট ৮ (Image 6 - Set 3) -----
        {
            name: "সেট ৮",
            questions: [
                { q: 'All ______ girls ______ this village have promised to fight ______ the curse ______ child marriage.',
                  opts: [['the', 'of', 'against', 'of'], ['a', 'from', 'with', 'for'], ['an', 'in', 'for', 'on']], ans: 0,
                  exp: '✅ “All the girls”, “of this village”, “fight against”, “curse of” – সঠিক article ও preposition।' },
                { q: 'She said to me, "Are you well?" — Change into indirect speech.',
                  opts: ['She asked me if I was well.', 'She said me are you well.', 'She told me if I am well.'], ans: 0,
                  exp: '✅ “asked if” + “I was well” – indirect question।' },
                { q: 'He is too short to reach the fruit of the tree. — Remove "too" and "to".',
                  opts: ['He is so short that he cannot reach the fruit of the tree.', 'He is short so cannot reach.', 'He is very short to reach.'], ans: 0,
                  exp: '✅ “too … to” → “so … that … cannot” – জটিল বাক্য।' },
                { q: 'I know the man. — Change the voice.',
                  opts: ['The man is known to me.', 'The man is known by me.', 'I am known the man.'], ans: 0,
                  exp: '✅ Passive: “The man is known to me” – পরিচিত।' },
                { q: 'He is the tallest boy in the class. — Change the degree.',
                  opts: ['No other boy in the class is as tall as he.', 'He is taller than all.', 'He is tall boy.'], ans: 0,
                  exp: '✅ Positive: “No other … as tall as he” – তুলনামূলক থেকে ইতিবাচক।' },
                { q: 'How could you tolerate such rude words? — Replace with phrasal verb (bear with).',
                  opts: ['bear with', 'keep on', 'take after'], ans: 0,
                  exp: '✅ “tolerate” → “bear with” – সহ্য করা।' },
                { q: 'The girl continued practising the song. — Replace with phrasal verb (keep on).',
                  opts: ['kept on', 'bear with', 'pass away'], ans: 0,
                  exp: '✅ “continued” → “kept on” – চালিয়ে যাওয়া।' },
                { q: 'The boy resembles his father. — Replace with phrasal verb (take after).',
                  opts: ['takes after', 'keep on', 'pass away'], ans: 0,
                  exp: '✅ “resembles” → “takes after” – সদৃশ হওয়া।' },
                { q: 'The great leader died last week. — Replace with phrasal verb (pass away).',
                  opts: ['passed away', 'take after', 'put away'], ans: 0,
                  exp: '✅ “died” → “passed away” – মৃত্যুবরণ করা।' }
            ]
        },
        // ----- সেট ৯ (Image 7 - Set 4) -----
        {
            name: "সেট ৯",
            questions: [
                { q: 'What is ______ most dreadful menace facing India today is the rise ______ Communalism. We all should fight ______ it collectively.',
                  opts: [['the', 'of', 'against'], ['a', 'in', 'for'], ['an', 'with', 'on']], ans: 0,
                  exp: '✅ “the most dreadful” (শ্রেষ্ঠ), “rise of Communalism”, “fight against” – সঠিক article ও preposition।' },
                { q: '"Here comes someone ______ (Run)", said the hermit. The king ______ (turn) round and saw a bearded man running towards them. His hands pressed against his stomach from which blood ______ (flow).',
                  opts: [['running', 'turned', 'was flowing'], ['run', 'turn', 'flowed'], ['ran', 'turning', 'flows']], ans: 0,
                  exp: '✅ “running” (participle), “turned” (অতীত), “was flowing” (চলছিল) – ক্রমবাচক।' },
                { q: 'They fought the battle. — Change the voice.',
                  opts: ['The battle was fought by them.', 'The battle fought by them.', 'They were fought battle.'], ans: 0,
                  exp: '✅ Passive: “The battle was fought by them.”' },
                { q: 'I said to her, "Where were you?" — Change narration.',
                  opts: ['I asked her where she had been.', 'I said her where were you.', 'I told her where she was.'], ans: 0,
                  exp: '✅ “asked + where + had been” – indirect question।' },
                { q: 'She is as fair as a Rose. — Change into comparative degree.',
                  opts: ['A rose is not fairer than she.', 'She is fairer than a rose.', 'She is more fair than rose.'], ans: 0,
                  exp: '✅ Comparative: “A rose is not fairer than she” – ইতিবাচক থেকে তুলনামূলক।' },
                { q: 'Gandhiji sacrificed his life for his motherland. — Replace with phrasal verb (give up).',
                  opts: ['gave up', 'look into', 'look for'], ans: 0,
                  exp: '✅ “sacrificed” → “gave up” – উৎসর্গ করা।' },
                { q: 'Police is investigating the case. — Replace with phrasal verb (look into).',
                  opts: ['looking into', 'give up', 'come by'], ans: 0,
                  exp: '✅ “investigating” → “looking into” – তদন্ত করা।' },
                { q: 'She is trying to find a job. — Replace with phrasal verb (look for).',
                  opts: ['looking for', 'give up', 'look into'], ans: 0,
                  exp: '✅ “find” → “looking for” – খোঁজ করা।' }
            ]
        }
    ];

    // ============================================================
    //  RENDER ENGINE
    // ============================================================
    const container = document.getElementById('setContainer');
    const menuDropdown = document.getElementById('menuDropdown');
    let currentSet = 0;

    // Build menu buttons
    setsData.forEach((set, idx) => {
        const btn = document.createElement('button');
        btn.dataset.index = idx;
        btn.textContent = set.name;
        menuDropdown.appendChild(btn);
    });

    function renderAllSets() {
        container.innerHTML = '';
        setsData.forEach((set, idx) => {
            const card = document.createElement('div');
            card.className = `set-card${idx === currentSet ? ' active' : ''}`;
            card.dataset.index = idx;

            // header
            const header = document.createElement('div');
            header.className = 'set-header';
            header.innerHTML = `
                <span class="badge-set">📌 ${set.name}</span>
                <span class="q-count">${set.questions.length} টি প্রশ্ন</span>
            `;
            card.appendChild(header);

            // questions
            set.questions.forEach((q, qi) => {
                const block = document.createElement('div');
                block.className = 'question-block';

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.textContent = `${qi+1}. ${q.q}`;
                block.appendChild(qText);

                const optDiv = document.createElement('div');
                optDiv.className = 'options';

                // If options are array of arrays (for fill-in-the-blanks)
                let optList = q.opts;
                // If options are simple array (for transformation)
                if (q.opts.length > 0 && typeof q.opts[0] === 'string') {
                    optList = q.opts.map(o => [o]);
                }

                optList.forEach((optArr, oi) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = Array.isArray(optArr) ? optArr.join(' · ') : optArr;
                    btn.dataset.opt = oi;

                    btn.addEventListener('click', function() {
                        const parent = this.closest('.question-block');
                        parent.querySelectorAll('.option-btn').forEach(b => {
                            b.classList.remove('correct', 'wrong');
                        });

                        const isCorrect = (oi === q.ans);
                        this.classList.add(isCorrect ? 'correct' : 'wrong');

                        let expl = parent.querySelector('.explanation');
                        if (!expl) {
                            expl = document.createElement('div');
                            expl.className = 'explanation';
                            parent.appendChild(expl);
                        }
                        expl.innerHTML = `<strong>📖 ব্যাখ্যা:</strong> ${q.exp}`;
                        expl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    });

                    optDiv.appendChild(btn);
                });

                block.appendChild(optDiv);
                card.appendChild(block);
            });

            container.appendChild(card);
        });
    }

    function showSet(index) {
        currentSet = index;
        document.querySelectorAll('.set-card').forEach((c, i) => {
            c.classList.toggle('active', i === index);
        });
        document.querySelectorAll('.menu-dropdown button').forEach((btn, i) => {
            btn.classList.toggle('active-set', i === index);
        });
        // Close dropdown on mobile
        const dd = document.getElementById('menuDropdown');
        if (window.innerWidth < 640) dd.style.display = 'none';
    }

    // Toggle menu
    document.getElementById('menuToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        const dd = document.getElementById('menuDropdown');
        dd.style.display = dd.style.display === 'none' ? 'flex' : 'none';
    });

    // Menu button clicks
    document.querySelectorAll('.menu-dropdown button').forEach((btn) => {
        btn.addEventListener('click', function() {
            showSet(parseInt(this.dataset.index));
            const dd = document.getElementById('menuDropdown');
            if (window.innerWidth < 640) dd.style.display = 'none';
        });
    });

    // Close dropdown on outside click
    document.addEventListener('click', function(e) {
        const dd = document.getElementById('menuDropdown');
        const toggle = document.getElementById('menuToggle');
        if (!dd.contains(e.target) && !toggle.contains(e.target)) {
            dd.style.display = 'none';
        }
    });

    // Initialize
    renderAllSets();
    showSet(0);
})();
</script>
