<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সম্পূর্ণ ইংরেজি গ্রামার - সব প্রশ্ন</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f0ebe5; min-height: 100vh; padding: 15px; }
        .app { max-width: 950px; margin: 0 auto; background: white; border-radius: 28px; padding: 20px 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .menu-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #e8e0d8; padding: 10px 16px; border-radius: 50px; margin-bottom: 25px; }
        .menu-bar .brand { font-weight: 700; font-size: 1.1rem; color: #2d1f14; margin-right: auto; }
        .menu-btn { background: #d5c9bd; border: none; font-size: 1.5rem; padding: 4px 14px; border-radius: 30px; cursor: pointer; color: #2d1f14; font-weight: bold; }
        .menu-btn:hover { background: #c4b5a6; }
        .menu-dropdown { display: flex; flex-wrap: wrap; gap: 4px; background: white; padding: 8px 10px; border-radius: 40px; width: 100%; margin-top: 4px; max-height: 300px; overflow-y: auto; }
        .menu-dropdown button { background: #ede7e0; border: none; padding: 4px 10px; border-radius: 30px; font-weight: 500; color: #2d1f14; cursor: pointer; font-size: 0.7rem; transition: 0.2s; white-space: nowrap; }
        .menu-dropdown button:hover { background: #d5c9bd; }
        .menu-dropdown button.active-set { background: #8b7a6a; color: white; }
        .set-card { display: none; animation: fadeIn 0.3s ease; }
        .set-card.active { display: block; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        .question-block { background: #faf8f5; border-radius: 20px; padding: 16px 18px; margin-bottom: 16px; border: 1px solid #e0d6cc; }
        .question-text { font-size: 0.92rem; font-weight: 500; color: #1f140e; line-height: 1.7; margin-bottom: 10px; }
        .question-text .blank { color: #c0392b; font-weight: 700; text-decoration: underline; text-decoration-color: #c0392b; text-underline-offset: 3px; }
        .answer-area { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 4px; }
        .answer-input { padding: 8px 16px; border: 2px solid #d5c9bd; border-radius: 30px; font-size: 0.9rem; min-width: 200px; flex: 1; outline: none; transition: 0.2s; background: white; }
        .answer-input:focus { border-color: #8b7a6a; box-shadow: 0 0 0 3px rgba(139, 122, 106, 0.2); }
        .answer-input.correct { border-color: #2e7d32; background: #e8f5e9; }
        .answer-input.wrong { border-color: #c62828; background: #ffebee; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .check-btn { background: #8b7a6a; color: white; border: none; padding: 8px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .check-btn:hover { background: #6d5e4f; transform: scale(0.97); }
        .show-answer-btn { background: #d5c9bd; color: #2d1f14; border: none; padding: 8px 18px; border-radius: 30px; font-weight: 500; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .show-answer-btn:hover { background: #c4b5a6; }
        .explanation { background: #f1ece6; border-radius: 16px; padding: 12px 18px; margin: 12px 0 2px; font-size: 0.9rem; border-left: 5px solid #8b7a6a; color: #1f180f; line-height: 1.6; display: none; }
        .explanation.show { display: block; }
        .explanation strong { color: #4a3728; }
        .explanation .correct-answer { color: #2e7d32; font-weight: 700; }
        .badge-set { display: inline-block; background: #cdbeb1; color: #241b13; font-size: 0.65rem; font-weight: 600; padding: 2px 12px; border-radius: 30px; margin-bottom: 4px; }
        .footer-note { margin-top: 22px; text-align: center; font-size: 0.8rem; color: #756352; border-top: 1px solid #e0d5ca; padding-top: 14px; }
        .q-count { color: #7a6856; font-size: 0.75rem; }
        .set-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .total-questions { background: #8b7a6a; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.65rem; }
        .progress-bar { background: #e8e0d8; height: 4px; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: #8b7a6a; height: 100%; transition: width 0.3s; width: 0%; }
        .status-text { font-size: 0.8rem; color: #6d5e4f; margin-top: 4px; }
        .result-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .result-badge.correct { background: #c8e6c9; color: #1b5e20; }
        .result-badge.wrong { background: #ffcdd2; color: #b71c1c; }
        @media (max-width: 600px) { .app { padding: 10px 12px; } .menu-bar { padding: 6px 10px; } .question-text { font-size: 0.85rem; } .answer-input { font-size: 0.8rem; min-width: 120px; padding: 6px 12px; } .check-btn, .show-answer-btn { font-size: 0.75rem; padding: 6px 14px; } }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="menu-bar">
        <span class="brand">📝 সম্পূর্ণ গ্রামার কুইজ</span>
        <span class="total-questions" id="totalQ">০টি</span>
        <button class="menu-btn" id="menuToggle">☰</button>
        <div class="menu-dropdown" id="menuDropdown" style="display: none;"></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="set-container" id="setContainer"></div>
    <div class="footer-note">✅ উত্তর টাইপ করুন → চেক করুন → ব্যাখ্যা দেখুন · মেনুতে সেট বদলান</div>
</div>

<script>
(function() {
    // ============================================================
    //  COMPLETE DATA - ALL QUESTIONS FROM ALL UPLOADS
    // ============================================================
    const setsData = [
        // ====== SET 1: Articles & Prepositions (First Batch) ======
        {
            name: "১. Article-Preposition-১",
            questions: [
                { q: 'Most people are fond ______ mystery stories. They find ______ extra pleasure ______ trying to solve the mystery.', blanks: ['of', 'an', 'in'], exp: '✅ “fond of” + “an extra pleasure” + “in trying” – সঠিক preposition ও article।' },
                { q: '______ July 2023, Dinesh and Tarak Shinde, both Police constables ______ the Maharashtra Police force, achieved ______ commendable feat of nabbing the dreaded robber Sanga from his hideout ______ Latur.', blanks: ['In', 'of', 'a', 'in'], exp: '✅ “In July”, “of the Police force”, “a commendable feat”, “in Latur” – সঠিক।' },
                { q: 'When I was ______ girl every holiday that I had seemed ideal, my parents took me ______ train or car ______ a place by the sea.', blanks: ['a', 'by', 'to'], exp: '✅ “a girl”, “by train/car”, “to a place” – সঠিক article ও preposition।' },
                { q: 'India beat Pakistan ______ six runs in ______ T20 World Cup 2024 Group A match ______ the Nassau County International Cricket Stadium in New York.', blanks: ['by', 'the', 'at'], exp: '✅ “by six runs”, “the T20 World Cup”, “at the stadium” – সঠিক।' },
                { q: 'Man is the architect ______ his own fate. If he makes ______ proper division of his time and does his duties accordingly, he is sure ______ improve and prosper ______ life.', blanks: ['of', 'a', 'to', 'in'], exp: '✅ “architect of”, “a proper division”, “sure to improve”, “prosper in life” – সঠিক preposition।' },
                { q: '______ October 12, 1492 Christopher Columbus first saw ______ new world, nine weeks ______ leaving Spain.', blanks: ['On', 'the', 'after'], exp: '✅ “On October 12”, “the new world”, “after leaving” – সঠিক।' },
                { q: 'All ______ girls ______ this village have promised to fight ______ the curse ______ child marriage.', blanks: ['the', 'of', 'against', 'of'], exp: '✅ “All the girls”, “of this village”, “fight against”, “curse of” – সঠিক।' },
                { q: 'What is ______ most dreadful menace facing India today is the rise ______ Communalism. We all should fight ______ it collectively.', blanks: ['the', 'of', 'against'], exp: '✅ “the most dreadful”, “rise of Communalism”, “fight against” – সঠিক।' },
                { q: 'I take this opportunity ______ thank you from ______ bottom of my heart ______ all that you have done.', blanks: ['to', 'the', 'for'], exp: '✅ “opportunity to”, “from the bottom”, “for all that” – সঠিক।' },
                { q: '______ Nobel Prize ______ Literature for 2025 is awarded ______ the Hungarian author László Krasznahorkai.', blanks: ['The', 'for', 'to'], exp: '✅ “The Nobel Prize”, “for Literature”, “awarded to” – সঠিক।' }
            ]
        },
        // ====== SET 2: Articles & Prepositions (Second Batch) ======
        {
            name: "২. Article-Preposition-২",
            questions: [
                { q: 'You go out ______ cool fresh morning to see if all is right ______ the zoo.', blanks: ['on a', 'at'], exp: '✅ “on a cool fresh morning”, “at the zoo” – সঠিক।' },
                { q: 'Last year we visited Puri ______ summer we stayed in a hotel ______ the river. Though ______ hotel was a bit expensive it was very nice.', blanks: ['in', 'near', 'the'], exp: '✅ “in summer”, “near the river”, “the hotel” – সঠিক।' },
                { q: 'When I was old enough ______ ask questions, I asked my father about ______ relevance ______ prayer.', blanks: ['to', 'the', 'of'], exp: '✅ “enough to ask”, “the relevance”, “of prayer” – সঠিক।' },
                { q: 'Water is crucial ______ all components ______ life which makes it ______ necessary resource for day-to-day activities.', blanks: ['for', 'of', 'a'], exp: '✅ “crucial for”, “components of life”, “a necessary resource” – সঠিক।' },
                { q: 'It is always spoken as ______ reproach ______ cats that they are more fond ______ their home than the people in it.', blanks: ['a', 'against', 'of'], exp: '✅ “a reproach”, “against cats”, “fond of” – সঠিক।' },
                { q: '______ boy from the green chair stood up ______ ask me ______ question.', blanks: ['The', 'to', 'a'], exp: '✅ “The boy”, “to ask”, “a question” – সঠিক।' },
                { q: 'We had no control ______ such ______ situation. So the result was contrary ______ our expectation.', blanks: ['over', 'a', 'to'], exp: '✅ “control over”, “such a situation”, “contrary to” – সঠিক।' },
                { q: 'Raja John Vurputoor Chari, ______ Indian-American US Air Force Colonel, is among 18 astronauts, who have been selected ______ NASA for its man mission ______ the moon in 2024.', blanks: ['an', 'by', 'to'], exp: '✅ “an Indian-American”, “selected by NASA”, “mission to the moon” – সঠিক।' },
                { q: 'According to Swami Vivekananda, education is ______ manifestation ______ perfection already ______ man.', blanks: ['the', 'of', 'in'], exp: '✅ “the manifestation”, “of perfection”, “in man” – সঠিক।' },
                { q: 'Father snatched ______ letter away ______ Swami and tore it ______ pieces.', blanks: ['the', 'from', 'into'], exp: '✅ “the letter”, “away from Swami”, “into pieces” – সঠিক।' }
            ]
        },
        // ====== SET 3: Verb Forms (First Batch) ======
        {
            name: "৩. Verb Forms-১",
            questions: [
                { q: 'Today we are ______ (confine) in a room as it ______ (rain) since morning and we are busy ______ (play) ludo.', blanks: ['confined', 'has been raining', 'playing'], exp: '✅ “confined” (বন্দী) + “has been raining” (সকাল থেকে) + “playing” (ব্যস্ত) – বর্তমান নিখুঁত ও চলমান কাজ।' },
                { q: 'Mother generously ______ (suggest) that Swami ______ (may) stay at home. It was 9.30 when he ought to ______ (be) in the school hall.', blanks: ['suggested', 'might', 'have been'], exp: '✅ অতীত “suggested”, “might” (সম্ভাবনা), “ought to have been” – উচিত ছিল।' },
                { q: 'Mr. Shanker said, he ______ (go) to ______ (visit) Vaishno Devi shrine. He ______ (accompany) by his wife and two children.', blanks: ['had gone', 'visit', 'was accompanied'], exp: '✅ “had gone” (পূর্বে গিয়েছিলেন), “to visit”, “was accompanied” (প্যাসিভ) – সাথে ছিলেন।' },
                { q: 'One of my friends ______ (injure) in a bus accident. I would have ______ (help) him if I ______ (be) a doctor.', blanks: ['was injured', 'helped', 'were'], exp: '✅ “one of” + singular → was injured; conditional: would have + V3; “if I were” (subjunctive)।' },
                { q: 'The train ______ (leave) the station before we ______ (reach). But we ______ (make) no comment to our guide.', blanks: ['had left', 'reached', 'made'], exp: '✅ “had left” (পূর্বে) + simple past “reached” + “made” (অতীত)।' },
                { q: '"Here comes someone ______ (run)", said the hermit. The king ______ (turn) round and saw a bearded man. Blood ______ (flow) from his stomach.', blanks: ['running', 'turned', 'was flowing'], exp: '✅ “running” (participle), “turned” (অতীত), “was flowing” (চলছিল) – ক্রমবাচক।' },
                { q: 'Swami Vivekananda ______ (travel) on foot from place to place ______ (spread) noble thought to thousands of people to ______ (awaken) their souls.', blanks: ['travelled', 'spreading', 'awaken'], exp: '✅ past “travelled”, participle “spreading”, infinitive “to awaken” – উদ্দেশ্য।' },
                { q: 'Eight more bodies ______ (find) on Monday as flood waters started receding, ______ (take) the toll to 36. Many more ______ (be) still missing.', blanks: ['were found', 'taking', 'are'], exp: '✅ passive “were found”, “taking” (participle), “are still missing” (বর্তমান অবস্থা)।' },
                { q: 'The train ______ (leave) before we ______ (reach).', blanks: ['had left', 'reached'], exp: '✅ “had left” (পূর্বে) + “reached” (সাধারণ অতীত) – past perfect + simple past।' },
                { q: 'It ______ (rain) since 5 O\'clock.', blanks: ['has been raining'], exp: '✅ “has been raining” – present perfect continuous (since 5 O\'clock)।' }
            ]
        },
        // ====== SET 4: Verb Forms (Second Batch) ======
        {
            name: "৪. Verb Forms-২",
            questions: [
                { q: 'As the temperature ______ (soar) so high, it ______ (advise) to take cool showers, people ______ (drink) plenty of water.', blanks: ['has been soaring', 'is advised', 'should drink'], exp: '✅ “has been soaring” (চলছে), “is advised” (উপদেশ), “should drink” (উচিত) – সঠিক verb form।' },
                { q: 'Although the children ______ (love) outdoor games, their parents ______ (consider) their interest as harmful. A child who spends time in outdoor activities ______ (grow) up to be healthy.', blanks: ['love', 'consider', 'grows'], exp: '✅ “children love” (বহুবচন), “parents consider” (বহুবচন), “grows” (সাধারণ সত্য) – সঠিক verb form।' },
                { q: 'The text book for class X ______ (mean) for the learners of English. At the end of each lesson sufficient exercises ______ (give) to develop language skills. The learners will love ______ (read) the textbook.', blanks: ['is meant', 'have been given', 'to read'], exp: '✅ “is meant” (উদ্দেশ্য), “have been given” (প্যাসিভ), “to read” (infinitive) – সঠিক।' },
                { q: 'Bread and butter ______ (be) what Ritam usually takes. He preferred to eat biscuits that he ______ (bring) from home. A few minutes after he ______ (see) getting down the street.', blanks: ['is', 'had brought', 'saw'], exp: '✅ “Bread and butter” একক (is), “had brought” (পূর্বে), “saw” (সাধারণ অতীত) – সঠিক।' },
                { q: 'At least two persons ______ (die) and six ______ (injure) in a train derailment. The drivers overshot the red signal ______ (result) in the derailment.', blanks: ['died', 'were injured', 'resulting'], exp: '✅ “died” (সক্রিয়), “were injured” (প্যাসিভ), “resulting” (participle) – সঠিক।' },
                { q: 'The Ministry on Friday ______ (advise) Indians ______ (live) in Canada to remain vigilant in view of the activities that ______ (increase) for the last two weeks.', blanks: ['advised', 'living', 'have been increasing'], exp: '✅ অতীত “advised”, “living” (participle), “have been increasing” (গত ২ সপ্তাহ) – সঠিক।' },
                { q: 'Jupiter was deeply ______ (move) by the mother\'s sorrow. He ______ (think) for a while and said, "The princess may return if she has not ______ (taste) food."', blanks: ['moved', 'thought', 'tasted'], exp: '✅ “was moved” (প্রভাবিত), “thought” (অতীত), “has not tasted” (পারফেক্ট) – সঠিক।' },
                { q: 'Drones ______ (use) on Monday to ______ (spray) larvicide. This is the first time such a drive ______ (take) inside the factory premises.', blanks: ['were used', 'spray', 'has been taken'], exp: '✅ “were used” (অতীত), “to spray” (infinitive), “has been taken” (present perfect passive) – সঠিক।' },
                { q: 'I was ______ (excite) to see my uncle. He ______ (come) after a long time. My joy ______ (know) no bound.', blanks: ['excited', 'had come', 'knew'], exp: '✅ “excited” (অবস্থা), “had come” (পূর্বে), “knew” (অতীত) – সঠিক।' },
                { q: 'One day the Giant ______ (come) back. He ______ (be) to visit his friend and ______ (stay) with him for seven years.', blanks: ['came', 'had been', 'stayed'], exp: '✅ simple past “came”, past perfect “had been”, simple past “stayed” – ক্রম।' }
            ]
        },
        // ====== SET 5: Voice Change (All) ======
        {
            name: "৫. Voice Change",
            questions: [
                { q: 'My brother had broken the window. → Change the voice.', blanks: ['The window had been broken by my brother.'], exp: '✅ Passive: “had been broken” – past perfect passive।' },
                { q: 'You make a very pretty squirrel track. → Change the voice.', blanks: ['A very pretty squirrel track is made by you.'], exp: '✅ Passive: “is made by you” – present passive।' },
                { q: 'The man was shot last night. → Change the voice.', blanks: ['Someone shot the man last night.'], exp: '✅ Active: “Someone shot the man last night.”' },
                { q: 'He gives away everything for the poor. → Change the voice.', blanks: ['Everything is given away by him for the poor.'], exp: '✅ Passive: “Everything is given away by him”' },
                { q: 'Sarita knows the solution to this problem. → Change the voice.', blanks: ['The solution to this problem is known to Sarita.'], exp: '✅ Passive: “is known to Sarita” – পরিচিত।' },
                { q: 'I know the man. → Change the voice.', blanks: ['The man is known to me.'], exp: '✅ Passive: “is known to me” – পরিচিত।' },
                { q: 'They fought the battle. → Change the voice.', blanks: ['The battle was fought by them.'], exp: '✅ Passive: “The battle was fought by them.”' },
                { q: 'I organised a blood donation camp. → Change the voice.', blanks: ['A blood donation camp was organised by me.'], exp: '✅ Passive: “was organised by me”' },
                { q: 'The book was placed upon the table. → Change the voice.', blanks: ['Someone placed the book upon the table.'], exp: '✅ Active: “Someone placed the book upon the table.”' },
                { q: 'You deserve your Samuel. → Change the voice.', blanks: ['Your Samuel is deserved by you.'], exp: '✅ Passive: “Your Samuel is deserved by you.”' }
            ]
        },
        // ====== SET 6: Voice Change (More) ======
        {
            name: "৬. Voice Change-২",
            questions: [
                { q: 'The poor man carried a heavy load. → Change the voice.', blanks: ['A heavy load was carried by the poor man.'], exp: '✅ Passive: “A heavy load was carried by the poor man.”' },
                { q: 'The headmaster gave away the prizes. → Change the voice.', blanks: ['The prizes were given away by the headmaster.'], exp: '✅ Passive: “were given away by the headmaster”' },
                { q: 'My wallet has been stolen. → Change the voice.', blanks: ['Someone has stolen my wallet.'], exp: '✅ Active: “Someone has stolen my wallet.”' },
                { q: 'He gave me a camera on my birthday. → Change the voice.', blanks: ['I was given a camera by him on my birthday.'], exp: '✅ Passive: “I was given a camera by him” – অপ্রত্যক্ষ বস্তু কর্তা।' },
                { q: 'Her behaviour shocked me. → Change the voice.', blanks: ['I was shocked by her behaviour.'], exp: '✅ Passive: “I was shocked by her behaviour.”' },
                { q: 'Please come here. → Change the voice.', blanks: ['You are requested to come here.'], exp: '✅ Passive of request: “You are requested to come here.”' },
                { q: 'Who taught you English? → Change the voice.', blanks: ['By whom were you taught English?'], exp: '✅ Passive: “By whom were you taught English?”' },
                { q: 'He bought a grammar book last month. → Change the voice.', blanks: ['A grammar book was bought by him last month.'], exp: '✅ Passive: “was bought by him”' },
                { q: 'Can you do this exercise? → Change the voice.', blanks: ['Can this exercise be done by you?'], exp: '✅ Passive: “Can this exercise be done by you?” – modal + passive।' },
                { q: 'The teacher delivered a lecture. → Change the voice.', blanks: ['A lecture was delivered by the teacher.'], exp: '✅ Passive: “A lecture was delivered … by the teacher”' }
            ]
        },
        // ====== SET 7: Narration Change (All) ======
        {
            name: "৭. Narration Change",
            questions: [
                { q: 'Nisha said to Romita, "Have you completed your task?" → Change narration.', blanks: ['Nisha asked Romita if she had completed her task.'], exp: '✅ “asked if” + past perfect (had completed) – indirect question।' },
                { q: '"What have you written, Sachin?" → Change narration.', blanks: ['He asked Sachin what he had written.'], exp: '✅ “asked + what + had written” – indirect question।' },
                { q: 'He said to me, "Let me speak freely" → Change narration.', blanks: ['He told me that he might be allowed to speak freely.'], exp: '✅ “Let me” → “that he might be allowed to” – অনুমতি প্রার্থনা।' },
                { q: 'The boy said to his friend, "I went to school yesterday." → Change narration.', blanks: ['The boy told his friend that he had gone to school the previous day.'], exp: '✅ “went” → “had gone”, “yesterday” → “the previous day”' },
                { q: 'She said to me, "Are you well?" → Change narration.', blanks: ['She asked me if I was well.'], exp: '✅ “asked if” + “I was well” – indirect question।' },

    // ============================================================
    //  RENDER ENGINE
    // ============================================================
    const container = document.getElementById('setContainer');
    const menuDropdown = document.getElementById('menuDropdown');
    let currentSet = 0;

    // Build menu
    setsData.forEach((set, idx) => {
        const btn = document.createElement('button');
        btn.dataset.index = idx;
        btn.textContent = set.name;
        menuDropdown.appendChild(btn);
    });

    let totalQ = 0;
    setsData.forEach(s => totalQ += s.questions.length);
    document.getElementById('totalQ').textContent = totalQ + 'টি প্রশ্ন';

    let progress = {};

    function updateProgress(setIdx) {
        const card = document.querySelectorAll('.set-card')[setIdx];
        if (!card) return;
        const blocks = card.querySelectorAll('.question-block');
        let done = 0;
        blocks.forEach(block => {
            const input = block.querySelector('.answer-input');
            if (input && (input.className.includes('correct') || input.className.includes('wrong'))) {
                done++;
            }
        });
        const total = blocks.length;
        const pct = total > 0 ? (done / total) * 100 : 0;
        const fill = document.getElementById('progressFill');
        if (fill) fill.style.width = pct + '%';
    }

    function renderAllSets() {
        container.innerHTML = '';
        setsData.forEach((set, idx) => {
            const card = document.createElement('div');
            card.className = `set-card${idx === currentSet ? ' active' : ''}`;
            card.dataset.index = idx;

            const header = document.createElement('div');
            header.className = 'set-header';
            header.innerHTML = `
                <span class="badge-set">📌 ${set.name}</span>
                <span class="q-count">${set.questions.length} টি প্রশ্ন</span>
            `;
            card.appendChild(header);

            set.questions.forEach((q, qi) => {
                const block = document.createElement('div');
                block.className = 'question-block';

                const qText = document.createElement('div');
                qText.className = 'question-text';
                let displayText = q.q;
                const blankCount = (q.blanks || []).length;
                if (blankCount > 0) {
                    let parts = displayText.split('______');
                    let newText = '';
                    for (let i = 0; i < parts.length; i++) {
                        newText += parts[i];
                        if (i < parts.length - 1) {
                            newText += `<span class="blank">[${i+1}]</span>`;
                        }
                    }
                    displayText = newText;
                }
                qText.innerHTML = `${qi+1}. ${displayText}`;
                block.appendChild(qText);

                const answerArea = document.createElement('div');
                answerArea.className = 'answer-area';

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'answer-input';
                input.placeholder = 'আপনার উত্তর টাইপ করুন...';
                answerArea.appendChild(input);

                const btnGroup = document.createElement('div');
                btnGroup.className = 'btn-group';

                const checkBtn = document.createElement('button');
                checkBtn.className = 'check-btn';
                checkBtn.textContent = '✅ চেক করুন';

                const showBtn = document.createElement('button');
                showBtn.className = 'show-answer-btn';
                showBtn.textContent = '💡 দেখুন';

                btnGroup.appendChild(checkBtn);
                btnGroup.appendChild(showBtn);
                answerArea.appendChild(btnGroup);

                const statusText = document.createElement('div');
                statusText.className = 'status-text';
                statusText.textContent = '';

                const explDiv = document.createElement('div');
                explDiv.className = 'explanation';
                const correctAns = (q.blanks || []).join(', ');
                explDiv.innerHTML = `
                    <strong>📖 সঠিক উত্তর:</strong> <span class="correct-answer">${correctAns}</span><br>
                    <strong>💡 ব্যাখ্যা:</strong> ${q.exp || 'সঠিক উত্তরটি উপরে দেওয়া আছে।'}
                `;

                checkBtn.addEventListener('click', function() {
                    const userAnswer = input.value.trim();
                    const correctAnswers = q.blanks || [];
                    const userParts = userAnswer.split(/[,،\s]+/).filter(p => p.length > 0);
                    
                    let allCorrect = false;
                    if (correctAnswers.length === 1) {
                        allCorrect = userAnswer.toLowerCase() === correctAnswers[0].toLowerCase();
                    } else if (userParts.length === correctAnswers.length) {
                        allCorrect = true;
                        for (let i = 0; i < correctAnswers.length; i++) {
                            if (userParts[i].toLowerCase() !== correctAnswers[i].toLowerCase()) {
                                allCorrect = false;
                                break;
                            }
                        }
                    }

                    if (allCorrect && userAnswer.length > 0) {
                        input.className = 'answer-input correct';
                        statusText.innerHTML = '<span class="result-badge correct">✅ সঠিক উত্তর!</span>';
                    } else if (userAnswer.length > 0) {
                        input.className = 'answer-input wrong';
                        statusText.innerHTML = `<span class="result-badge wrong">❌ ভুল উত্তর।</span> সঠিক: "${correctAnswers.join(', ')}"`;
                    } else {
                        statusText.textContent = '⚠️ অনুগ্রহ করে উত্তর টাইপ করুন।';
                        statusText.style.color = '#e65100';
                    }

                    explDiv.classList.add('show');
                    updateProgress(idx);
                });

                showBtn.addEventListener('click', function() {
                    const correctAns = (q.blanks || []).join(', ');
                    input.value = correctAns;
                    input.className = 'answer-input correct';
                    statusText.innerHTML = '<span class="result-badge correct">✅ সঠিক উত্তর দেখানো হয়েছে।</span>';
                    explDiv.classList.add('show');
                    updateProgress(idx);
                });

                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        checkBtn.click();
                    }
                });

                block.appendChild(answerArea);
                block.appendChild(statusText);
                block.appendChild(explDiv);
                card.appendChild(block);
            });

            container.appendChild(card);
        });
    }

    function showSet(index) {
        currentSet = index;
        document.querySelectorAll('.set-card').forEach((c, i) => {
            c.classList.toggle('active', i === index);
        });
        document.querySelectorAll('.menu-dropdown button').forEach((btn, i) => {
            btn.classList.toggle('active-set', i === index);
        });
        const dd = document.getElementById('menuDropdown');
        if (window.innerWidth < 640) dd.style.display = 'none';
        updateProgress(index);
    }

    document.getElementById('menuToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        const dd = document.getElementById('menuDropdown');
        dd.style.display = dd.style.display === 'none' ? 'flex' : 'none';
    });

    document.querySelectorAll('.menu-dropdown button').forEach((btn) => {
        btn.addEventListener('click', function() {
            showSet(parseInt(this.dataset.index));
            const dd = document.getElementById('menuDropdown');
            if (window.innerWidth < 640) dd.style.display = 'none';
        });
    });

    document.addEventListener('click', function(e) {
        const dd = document.getElementById('menuDropdown');
        const toggle = document.getElementById('menuToggle');
        if (!dd.contains(e.target) && !toggle.contains(e.target)) {
            dd.style.display = 'none';
        }
    });

    renderAllSets();
    showSet(0);
})();
</script>
</body>
    </html>
